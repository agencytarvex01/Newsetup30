<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 10%,rgba(103,76,255,.30),transparent 32%),
    radial-gradient(circle at 10% 80%,rgba(0,196,255,.16),transparent 30%),
    radial-gradient(circle at 90% 70%,rgba(176,55,255,.13),transparent 28%),
    #030308;
}

/* Premium background glow */
body::before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(87,72,255,.12);
  filter:blur(100px);
  animation:bgMove 7s ease-in-out infinite alternate;
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:34px 34px;
  opacity:.20;
  pointer-events:none;
}

@keyframes bgMove{
  0%{transform:translate(-90px,-40px) scale(.8);}
  100%{transform:translate(90px,70px) scale(1.25);}
}

.container{
  width:92%;
  max-width:430px;
  text-align:center;
  position:relative;
  z-index:2;
}

/* DP rotating light border */
.dp-wrapper{
  width:122px;
  height:122px;
  padding:4px;
  margin:0 auto 25px;
  border-radius:23px;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 0 25px rgba(104,82,255,.35),
    0 0 70px rgba(0,180,255,.15);
}

/* Moving rainbow/light line */
.dp-wrapper::before{
  content:"";
  position:absolute;
  inset:-70%;
  background:conic-gradient(
    from 0deg,
    transparent 0deg,
    transparent 45deg,
    #6c5cff 75deg,
    #00d9ff 115deg,
    #ffffff 145deg,
    transparent 180deg,
    transparent 270deg,
    #a855f7 320deg,
    transparent 360deg
  );
  animation:rotateLight 2.7s linear infinite;
}

@keyframes rotateLight{
  to{transform:rotate(360deg);}
}

.dp-inner{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  padding:3px;
  border-radius:19px;
  background:#08080e;
}

.dp{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  border-radius:16px;
  background:#11111a;
}

/* Headline */
h1{
  font-size:32px;
  font-weight:900;
  letter-spacing:1.5px;
  margin-bottom:13px;
  text-shadow:
    0 0 10px rgba(255,255,255,.15),
    0 0 30px rgba(105,90,255,.25);
}

h3{
  font-size:13px;
  letter-spacing:2.2px;
  font-weight:600;
  color:#bfc5ff;
  margin-bottom:31px;
}

/* Premium button */
.telegram-btn{
  width:100%;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  border-radius:16px;
  text-decoration:none;
  color:#fff;
  font-size:15px;
  font-weight:800;
  letter-spacing:.7px;

  background:linear-gradient(
    135deg,
    #5949ff,
    #397dff,
    #684cff
  );

  box-shadow:
    0 0 18px rgba(81,91,255,.55),
    0 0 45px rgba(75,100,255,.30),
    inset 0 1px rgba(255,255,255,.35);

  animation:buttonGlow 2s ease-in-out infinite alternate;
  transition:.25s ease;
}

/* Shine sweep */
.telegram-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:65%;
  height:100%;
  background:linear-gradient(
    105deg,
    transparent,
    rgba(255,255,255,.10),
    rgba(255,255,255,.65),
    rgba(255,255,255,.10),
    transparent
  );
  transform:skewX(-22deg);
  animation:buttonShine 2.8s ease-in-out infinite;
}

/* Inner shine */
.telegram-btn::after{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.20);
  pointer-events:none;
}

@keyframes buttonShine{
  0%{left:-120%;}
  45%,100%{left:140%;}
}

@keyframes buttonGlow{
  from{
    box-shadow:
      0 0 15px rgba(81,91,255,.45),
      0 0 35px rgba(75,100,255,.22),
      inset 0 1px rgba(255,255,255,.30);
  }
  to{
    box-shadow:
      0 0 25px rgba(81,91,255,.75),
      0 0 65px rgba(75,100,255,.38),
      inset 0 1px rgba(255,255,255,.40);
  }
}

.telegram-btn:hover{
  transform:translateY(-3px) scale(1.01);
}

.telegram-btn:active{
  transform:scale(.97);
}

.telegram-icon{
  font-size:21px;
  margin-right:9px;
}

/* Footer */
.footer{
  margin-top:44px;
  padding-top:19px;
  border-top:1px solid rgba(255,255,255,.08);
  color:#85899f;
  font-size:12px;
  letter-spacing:.7px;
}

.footer strong{
  color:#d9dcff;
}

/* Mobile */
@media(max-width:380px){
  h1{font-size:28px;}
  .dp-wrapper{
    width:108px;
    height:108px;
  }
}
